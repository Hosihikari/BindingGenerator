name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Generator
        uses: actions/checkout@v4
        with:
          path: Generator

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/Bindings.Ir
          path: Ir

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/Bindings.Abi
          path: Abi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- version

      - name: Validate fixture IR
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-ir tests/fixtures/basic/ir-manifest.json tests/fixtures/basic

      - name: Emit fixture
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- emit tests/fixtures/basic/ir-manifest.json tests/fixtures/basic artifacts/emitted --abi-header ../Abi/native/hosihikari_abi.h

      - name: Validate emitted coverage
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-coverage artifacts/emitted/coverage/summary.json artifacts/emitted/coverage/manifest.jsonl

      - name: Compile shim stub
        working-directory: Generator
        run: g++ -std=c++20 -c artifacts/emitted/shim/win-x64-server/binding_table.cpp -o artifacts/binding_table.o

      - name: Validate real-shim fixture IR
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-ir tests/fixtures/real-shim/ir-manifest.json tests/fixtures/real-shim

      - name: Emit real-shim fixture
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- emit tests/fixtures/real-shim/ir-manifest.json tests/fixtures/real-shim artifacts/emitted-real --abi-header ../Abi/native/hosihikari_abi.h --native-root tests/fixtures/real-shim/native

      - name: Compile real BindingShim
        working-directory: Generator
        run: g++ -std=c++20 -I tests/fixtures/real-shim/native -c artifacts/emitted-real/shim/linux-x64-server/levilamina/binding_table.cpp -o artifacts/real-binding_table.o

      - name: Compile real-shim Interop
        working-directory: Generator
        run: dotnet build tests/RealShimCheck/RealShimCheck.csproj -c Release -p:InteropDirectory=${{ github.workspace }}/Generator/artifacts/emitted-real/interop

      - name: Emit link-carrier fixture
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- emit tests/fixtures/real-shim/ir-manifest.json tests/fixtures/real-shim artifacts/emitted-linked --abi-header ../Abi/native/hosihikari_abi.h --native-root tests/fixtures/real-shim/native --link-carrier

      - name: Link carrier BindingShim
        working-directory: Generator
        run: |
          g++ -std=c++20 -fPIC -I tests/fixtures/real-shim/native -c artifacts/emitted-linked/shim/linux-x64-server/levilamina/binding_table.cpp -o artifacts/linked-binding_table.o
          g++ -std=c++20 -fPIC -I tests/fixtures/real-shim/native -c tests/fixtures/real-shim/native/carrier.cpp -o artifacts/carrier.o
          g++ -shared -o artifacts/liblinked-shim.so artifacts/linked-binding_table.o artifacts/carrier.o

      - name: Run link-carrier smoke
        working-directory: Generator
        run: dotnet run --project tests/RealShimSmoke/RealShimSmoke.csproj -c Release -p:InteropDirectory=${{ github.workspace }}/Generator/artifacts/emitted-linked/interop -- ${{ github.workspace }}/Generator/artifacts/liblinked-shim.so

      - name: Validate symbol-dispatch fixture IR
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-ir tests/fixtures/symbol-dispatch/ir-manifest.json tests/fixtures/symbol-dispatch

      - name: Emit symbol-dispatch fixture
        working-directory: Generator
        run: dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- emit tests/fixtures/symbol-dispatch/ir-manifest.json tests/fixtures/symbol-dispatch artifacts/symbol-dispatch-fixture --abi-header ../Abi/native/hosihikari_abi.h --symbol-dispatch --target-module libsymbol-fixture.so

      - name: Build symbol-dispatch fixture
        working-directory: Generator
        run: |
          g++ -std=c++20 -shared -fPIC -O0 -g -o artifacts/libsymbol-fixture.so tests/symbol-dispatch/linux-fixture.cpp
          g++ -std=c++20 -fPIC -shared -I artifacts/symbol-dispatch-fixture/shim/linux-x64-server/bedrock -o artifacts/libsymbol-shim.so artifacts/symbol-dispatch-fixture/shim/linux-x64-server/bedrock/binding_table.cpp

      - name: Run symbol-dispatch smoke
        working-directory: Generator
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/Generator/artifacts
        run: dotnet run --project tests/SymbolDispatchSmoke/SymbolDispatchSmoke.csproj -c Release -p:InteropDirectory=${{ github.workspace }}/Generator/artifacts/symbol-dispatch-fixture/interop -- ${{ github.workspace }}/Generator/artifacts/libsymbol-fixture.so ${{ github.workspace }}/Generator/artifacts/libsymbol-shim.so

  endstone-linux-ir:
    runs-on: ubuntu-latest
    steps:
      - name: Generator
        uses: actions/checkout@v4
        with:
          path: Generator

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/Bindings.Ir
          path: Ir

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/Bindings.Abi
          path: Abi

      - name: Endstone bindings
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/Bindings.Endstone
          path: EndstoneBindings
          fetch-depth: 1

      - name: Endstone headers
        uses: actions/checkout@v4
        with:
          repository: EndstoneMC/endstone
          ref: v0.11.14
          path: endstone
          fetch-depth: 1

      - name: expected-lite
        uses: actions/checkout@v4
        with:
          repository: martinmoene/expected-lite
          ref: v0.9.0
          path: expected-lite
          fetch-depth: 1

      - name: nlohmann_json
        uses: actions/checkout@v4
        with:
          repository: nlohmann/json
          ref: v3.11.3
          path: nlohmann-json
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: llvm.tar.xz
          key: llvm-23.1.3-linux-x64

      - name: Download LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.xz

      - name: Extract LLVM
        run: |
          mkdir -p llvm
          tar -xf llvm.tar.xz -C llvm --strip-components=1
          rm -rf llvm/share llvm/lib/clang/*/lib

      - name: Build frontend
        working-directory: Generator
        run: ./frontend/build.sh --llvm-root "${{ github.workspace }}/llvm"

      - name: Generate Linux IR
        working-directory: Generator
        run: |
          ./frontend/run-endstone.sh \
            --endstone-root "${{ github.workspace }}/endstone" \
            --llvm-root "${{ github.workspace }}/llvm" \
            --expected-lite-include "${{ github.workspace }}/expected-lite/include" \
            --nlohmann-include "${{ github.workspace }}/nlohmann-json/include" \
            --compat-include "${{ github.workspace }}/EndstoneBindings/native/BindingShim/linux-compat.h" \
            --output artifacts/endstone-linux-ir

      - name: Upload Linux IR
        uses: actions/upload-artifact@v4
        with:
          name: endstone-linux-ir
          path: Generator/artifacts/endstone-linux-ir
          retention-days: 3

      - name: Emit from Linux IR
        working-directory: Generator
        run: |
          dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- \
            emit artifacts/endstone-linux-ir/ir-manifest.json \
            artifacts/endstone-linux-ir \
            artifacts/emitted-linux \
            --abi-header ../Abi/native/hosihikari_abi.h \
            --native-root ../endstone \
            --virtual-dispatch

      - name: Compare generated Interop
        working-directory: Generator
        run: diff -ru ../EndstoneBindings/src/Hosihikari.Bindings.Endstone.Interop/Generated artifacts/emitted-linux/interop/endstone

      - name: Compile Linux BindingShim
        working-directory: Generator
        run: |
          g++ -std=c++20 -shared -fPIC -O2 -pthread \
            -include ../EndstoneBindings/native/BindingShim/linux-compat.h \
            -I ../endstone/include \
            -I ../endstone/include/endstone \
            -I artifacts/endstone-generated/include \
            -I ../expected-lite/include \
            -I ../nlohmann-json/include \
            artifacts/emitted-linux/shim/linux-x64-server/endstone/binding_table.cpp \
            -o artifacts/libendstone-linux-shim.so \
            -ldl

      - name: Inspect exported entry points
        working-directory: Generator
        run: |
          nm -D --defined-only artifacts/libendstone-linux-shim.so \
            | grep -E 'hosihikari_(get_binding_table_v1|endstone_get_server)'
